name: phoenix-health-hub

# Full stack: PostgreSQL, Redis, the FastAPI API, the async worker, the
# Nginx web tier (React build + /api proxy) and the optional MCP server.
# Copy .env.example to .env and run ./install.sh before the first start.

x-db-url: &db_url >-
  postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./backend
    env_file: [.env]
    environment:
      DATABASE_URL: *db_url
      REDIS_URL: redis://redis:6379/0
      # Spool large multipart uploads onto the durable volume, not /tmp.
      TMPDIR: /data/exports/tmp
      # The commit running (./update.sh exports it), printed on reports.
      GIT_COMMIT: ${GIT_COMMIT:-}
      # API processes answering at the same time (one per core is a good
      # start; each holds up to DB_POOL_SIZE + DB_MAX_OVERFLOW database
      # connections).
      WEB_CONCURRENCY: ${API_WORKERS:-4}
      # A process silent this long is restarted; one stopping finishes
      # its requests within this; a kept-alive connection waits this.
      GUNICORN_CMD_ARGS: >-
        --timeout ${API_TIMEOUT_S:-30}
        --graceful-timeout ${API_GRACEFUL_S:-30}
        --keep-alive ${API_KEEPALIVE_S:-2}
    # Reach Ollama running on the Docker host (Linux needs this mapping so
    # OLLAMA_URL=http://host.docker.internal:11434 resolves).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    volumes:
      - media:/data/media
      - exports:/data/exports
      # Update notice: ./update.sh (host) writes what an update would
      # bring here; the page's « Installer » only drops a request file.
      - ./run:/data/update
      # (Optional) drop an unzipped export here for the CLI importer, then:
      #   docker compose exec api \
      #     python -m app.cli.import_apple_health /import/export.xml
      - ./import:/import:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health')
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  worker:
    build:
      context: ./backend
    command: ["arq", "app.workers.worker.WorkerSettings"]
    env_file: [.env]
    environment:
      DATABASE_URL: *db_url
      REDIS_URL: redis://redis:6379/0
      RUN_MIGRATIONS: "false"
      GIT_COMMIT: ${GIT_COMMIT:-}
    # The worker runs the photo AI analysis; let it reach the host's Ollama.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    volumes:
      - media:/data/media
      - exports:/data/exports
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: nginx/Dockerfile
      args:
        # Baked into the SPA at build time. Set VITE_MAP_KEY in .env for a
        # keyed map provider (MapTiler); leave empty for the keyless Carto
        # default. Rebuild the web image after changing these.
        VITE_MAP_KEY: ${VITE_MAP_KEY:-}
        VITE_TILE_URL: ${VITE_TILE_URL:-}
        VITE_TILE_ATTRIB: ${VITE_TILE_ATTRIB:-}
        # The version shown next to the name (./update.sh sets it).
        GIT_COMMIT: ${GIT_COMMIT:-}
    # Sizes, time limits, compression and cache of the web server
    # (nginx/default.conf.template; docs/guides/configuration.md).
    environment:
      WEB_MAX_BODY_MB: ${WEB_MAX_BODY_MB:-32}
      WEB_API_TIMEOUT_S: ${WEB_API_TIMEOUT_S:-120}
      WEB_SYNC_TIMEOUT_S: ${WEB_SYNC_TIMEOUT_S:-600}
      WEB_IMPORT_TIMEOUT_S: ${WEB_IMPORT_TIMEOUT_S:-3600}
      WEB_GZIP_LEVEL: ${WEB_GZIP_LEVEL:-5}
      WEB_GZIP_MIN_BYTES: ${WEB_GZIP_MIN_BYTES:-1024}
      WEB_DNS_TTL_S: ${WEB_DNS_TTL_S:-10}
      WEB_PROXY_BUFFER_KB: ${WEB_PROXY_BUFFER_KB:-64}
      WEB_PROXY_BUFFERS: ${WEB_PROXY_BUFFERS:-32}
      WEB_PROXY_BUSY_KB: ${WEB_PROXY_BUSY_KB:-128}
      WEB_ASSETS_CACHE_DAYS: ${WEB_ASSETS_CACHE_DAYS:-30}
    depends_on: [api]
    ports:
      - "${WEB_PORT:-8082}:80"
    restart: unless-stopped

  # MCP server. Enable with: docker compose --profile mcp up -d
  # Clients authenticate with their own hub:full API token (no secret here).
  mcp:
    build:
      context: ./mcp
    profiles: ["mcp"]
    env_file: [.env]
    environment:
      API_BASE_URL: http://api:8000/api/v1
      MCP_TRANSPORT: ${MCP_TRANSPORT:-streamable-http}
      MCP_PORT: "9000"
    ports:
      - "${MCP_BIND:-127.0.0.1}:${MCP_PORT:-9000}:9000"
    depends_on: [api]
    restart: unless-stopped

volumes:
  pgdata:
  media:
  exports:

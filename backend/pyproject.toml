[project]
name = "phoenix-health-hub-backend"
version = "0.1.0"
description = "Self-hosted personal health & training hub — REST API."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "gunicorn>=23.0,<24.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "sqlalchemy[asyncio]>=2.0.35,<2.1",
    "asyncpg>=0.30,<0.31",
    "alembic>=1.13,<2.0",
    "argon2-cffi>=23.1,<24.0",
    "pyjwt>=2.9,<3.0",
    "python-multipart>=0.0.12,<0.1",
    "redis>=5.1,<6.0",
    "arq>=0.26,<0.27",
    "httpx>=0.27,<0.28",
    "structlog>=24.4,<25.0",
    "email-validator>=2.2,<3.0",
    "pillow>=10.4,<12.0",
    "openpyxl>=3.1,<4.0",
    "fpdf2>=2.8,<3.0",
    "cryptography>=43,<45",
    "pyotp>=2.9,<3.0",
    "defusedxml>=0.7,<0.8",
    "pypdf>=5.0,<7.0",
    "pymupdf>=1.24,<2.0",
    "pytesseract>=0.3,<0.4",
    "pillow-heif>=0.16,<2.0",
    "zxing-cpp>=2.2,<4.0",
]

[project.optional-dependencies]
dev = [
    "aiosqlite>=0.20,<0.21",
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<0.25",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.7,<0.8",
    "mypy>=1.13,<2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 80
target-version = "py311"
src = ["app", "tests"]
extend-exclude = ["alembic"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C90", "D", "ANN", "S", "PL"]
ignore = ["D203", "D213", "ANN401", "ANN101", "ANN102", "PLC0415"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101", "S105", "S106", "D100", "D103", "D104",
    "ANN201", "PLR2004", "PLR0913",
]
"alembic/*" = ["D", "ANN", "E501"]
"app/seed/catalog.py" = ["E501"]
"app/services/metabolic_catalog.py" = ["E501"]
"app/services/photo_method.py" = ["E501"]
"app/services/apple_health/hk_catalog.py" = ["E501"]
"app/services/hae_names.py" = ["E501"]
"app/services/condition_links.py" = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 8

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = false
disallow_untyped_decorators = false
exclude = ["alembic/"]

[[tool.mypy.overrides]]
module = [
    "openpyxl.*",
    "defusedxml.*",
    "pymupdf.*",
    "pytesseract.*",
    "pillow_heif.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-q --cov=app --cov-report=term-missing"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

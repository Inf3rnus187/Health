# Pre-commit hooks — the same gates the CI enforces (§14.2). Install with:
#   pipx install pre-commit && pre-commit install
# Backend hooks require the dev deps: (cd backend && uv pip install -e ".[dev]").
default_language_version:
  python: python3

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: ["--fix"]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: local
    hooks:
      - id: mypy
        name: mypy (backend, strict)
        entry: bash -c 'cd backend && mypy app'
        language: system
        pass_filenames: false
        files: ^backend/app/.*\.py$

      - id: docs-updated
        name: code changes come with their docs and changelog
        entry: python3 tools/check_docs_updated.py
        language: system
        pass_filenames: false
        always_run: true

      - id: code-limits
        name: structural code limits (§14.1)
        entry: python3 tools/check_code_limits.py backend/app
        language: system
        pass_filenames: false
        files: ^backend/app/.*\.py$

      - id: frontend-lint
        name: frontend eslint + prettier
        entry: bash -c 'cd frontend && pnpm -s lint && pnpm -s format'
        language: system
        pass_filenames: false
        files: ^frontend/src/
